name: Build CursorCat v4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build EXE
        shell: cmd
        run: |
          call "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > vs_path.txt
          set /p VS_PATH=<vs_path.txt
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if not exist build mkdir build
          cl /nologo /O2 /EHsc /DUNICODE /D_UNICODE /std:c++17 main.cpp user32.lib gdi32.lib shell32.lib dwmapi.lib /Fe:build\CursorCat.exe /link /SUBSYSTEM:WINDOWS
          if not exist build\CursorCat.exe exit /b 1

      - name: Verify EXE
        shell: cmd
        run: dir build\CursorCat.exe

      - name: Upload CursorCat v4
        uses: actions/upload-artifact@v4
        with:
          name: CursorCat-v4-Windows
          path: build/CursorCat.exe
          if-no-files-found: error
